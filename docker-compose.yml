services:
  assistant:
    build: .
    image: cgtd
    container_name: cgtd
    env_file: .env
    environment:
      - TZ=Europe/Berlin
      - ALLOWED_FILE_DIRS=/root/.claude/channels/telegram/inbox:/root/.workspace-mcp/attachments
      - CGTD_DATA_DIR=/data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"   # OAuth callback for google-workspace; bound to localhost
    stdin_open: true
    tty: true
    restart: unless-stopped
  assistant_user2:
      image: cgtd
      container_name: cgtd_liu
      env_file: .env.liu  # отдельный файл с credentials
      environment:
        - TZ=Europe/Berlin
        - ALLOWED_FILE_DIRS=/root/.claude/channels/telegram/inbox:/root/.workspace-mcp/attachments
        - CGTD_DATA_DIR=/data                                                                                                                                                                                    
      volumes:                                                                                                                                                                                                   
        - ./data_liu:/data  # отдельная папка на хосте
      ports:                                                                                                                                                                                                     
        - "127.0.0.1:8001:8000"  # другой хост-порт                                                                                                                                                              
      stdin_open: true
      tty: true                                                                                                                                                                                                  
      restart: unless-stopped  
